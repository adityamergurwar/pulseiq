name: Monthly refresh and report pack

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *"
  push:
    branches: [main]
    paths:
      - "03_Data/csv/**"
      - "etl.py"
      - "pulseiq/**"
      - "scripts/build_monthly_*.py"
      - "scripts/verify_acceptance.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/monthly-refresh.yml"

permissions:
  contents: read

jobs:
  refresh-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the project
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project requirements
        run: python -m pip install -r requirements.txt

      - name: Rebuild the warehouse
        run: python etl.py

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Check governed metrics and hand calculations
        run: python scripts/verify_acceptance.py --stdout --output "${RUNNER_TEMP}/validation_results.md"

      - name: Build the latest monthly report pack
        run: |
          python scripts/build_monthly_pack.py --output "${RUNNER_TEMP}/PulseIQ_Monthly_Pack.pdf"
          python scripts/build_monthly_excel.py --output "${RUNNER_TEMP}/PulseIQ_Monthly_Pack.xlsx"

      - name: Keep the validation evidence and report pack
        uses: actions/upload-artifact@v7
        with:
          name: pulseiq-monthly-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/validation_results.md
            ${{ runner.temp }}/PulseIQ_Monthly_Pack.pdf
            ${{ runner.temp }}/PulseIQ_Monthly_Pack.xlsx
          if-no-files-found: error
          retention-days: 30
